{% extends "base.html" %}

{% block title %}Admin Sign In | ShieldScan{% endblock %}

{% block body_class %}auth-page{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo"><i class="fa-solid fa-user-shield"></i></div>
                <h1>Administrator</h1>
                <p>Sign in to the ShieldScan admin panel</p>
            </div>
            {% include "components/flash_messages.html" %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ email or '' }}" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
            <div class="auth-footer mt-3" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top:0.75rem;">
                <a href="{{ url_for('auth.login') }}" style="color: rgba(255,255,255,0.4); font-size: 0.78rem; display:inline-flex; align-items:center; gap:0.3rem; text-decoration:none;" onmouseover="this.style.color='rgba(255,255,255,0.75)'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">
                    <i class="fa-solid fa-shield-halved" style="font-size:0.7rem;"></i> User Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
