{% extends "base.html" %}

{% block title %}Sign In | ShieldScan{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <div class="auth-logo"><i class="fa-solid fa-shield-halved"></i></div>
            <h1>Welcome back</h1>
            <p>Sign in to your security dashboard</p>
        </div>

        {% include "components/flash_messages.html" %}

        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       value="{{ email or '' }}" placeholder="you@example.com" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>

        <p class="auth-footer">
            No account? <a href="{{ url_for('auth.register') }}">Create one</a>
        </p>
        <p class="auth-footer" style="margin-top:0.5rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top:0.75rem;">
            <a href="/admin/login" style="color: rgba(255,255,255,0.4); font-size: 0.78rem; display:inline-flex; align-items:center; gap:0.3rem; text-decoration:none;" onmouseover="this.style.color='rgba(255,255,255,0.75)'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">
                <i class="fa-solid fa-user-shield" style="font-size:0.7rem;"></i> Admin? Sign in here
            </a>
        </p>
    </div>
</div>
{% endblock %}
