{% extends "base.html" %}

{% block title %}Register | ShieldScan{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <div class="auth-logo"><i class="fa-solid fa-shield-halved"></i></div>
            <h1>Create account</h1>
            <p>Start protecting yourself from scams & phishing</p>
        </div>

        {% include "components/flash_messages.html" %}

        <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       value="{{ username or '' }}" placeholder="Your name" required autofocus>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       value="{{ email or '' }}" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Min. 8 characters" required minlength="8">
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       placeholder="Repeat password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>

        <p class="auth-footer">
            Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
